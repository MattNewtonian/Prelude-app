[build]
  publish = "public"

# Replace https://prelude-app.onrender.com with your actual Render service URL, e.g.:
# https://prelude-app-xxxx.onrender.com

[[redirects]]
  from = "/api/*"
  to = "https://prelude-app.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/outputs/*"
  to = "https://prelude-app.onrender.com/outputs/:splat"
  status = 200
  force = true
